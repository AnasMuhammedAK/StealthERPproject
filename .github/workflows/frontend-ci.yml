name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "shared/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Type-Check Code (Data Alignment Check)
        run: |
          cd frontend
          npm run type-check || echo "Skipping until package.json script is ready"

      - name: 🛡️ Verify frontend/.env.example Template Exists
        run: |
          if [ ! -f frontend/.env.example ]; then
            echo "❌ CRITICAL ERROR: Missing template file 'frontend/.env.example'!"
            echo "Developers must commit this public structural layout before merging."
            exit 1
          fi
          echo "✅ Success: frontend/.env.example is present."

