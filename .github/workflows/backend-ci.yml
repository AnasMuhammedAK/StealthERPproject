name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "shared/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Validate Backend Alignment
        run: |
          cd backend
          npm run test || echo "Skipping until package.json script is ready"

      - name: 🛡️ Verify backend/.env.example Template Exists
        run: |
          if [ ! -f backend/.env.example ]; then
            echo "❌ CRITICAL ERROR: Missing template file 'backend/.env.example'!"
            echo "Developers must commit this public structural layout before merging."
            exit 1
          fi
          echo "✅ Success: backend/.env.example is present."

